version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
    ignore:
      # recurring-ical-events exige python-dateutil<3.0.0: la 3.x no se puede
      # instalar. Quitar esta regla cuando recurring-ical-events la soporte.
      - dependency-name: python-dateutil
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
